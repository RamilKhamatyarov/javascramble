<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title>Markdown File</title>
    <style>
        .markdown-content {
            background-color: #f8f9fa;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            line-height: 1.6;
            margin: 20px 0;
        }
        .file-info {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .markdown-body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .markdown-body img {
            max-width: 100%;
            height: auto;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 4px;
            background-color: white;
        }
        .markdown-body code {
            background-color: rgba(175, 184, 193, 0.2);
            border-radius: 6px;
            padding: 0.2em 0.4em;
            font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', 'Menlo', monospace;
            font-size: 0.85em;
        }
        .markdown-body pre {
            background-color: #f6f8fa;
            border-radius: 6px;
            padding: 16px;
            overflow: auto;
            border: 1px solid #e1e4e8;
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #dfe2e5;
            padding-left: 16px;
            margin-left: 0;
            color: #6a737d;
            font-style: italic;
        }
        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }
        .markdown-body table th,
        .markdown-body table td {
            border: 1px solid #dfe2e5;
            padding: 6px 13px;
        }
        .markdown-body table th {
            background-color: #f6f8fa;
            font-weight: 600;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
            margin-top: 1.5em;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
        }
        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }
        .markdown-body a:hover {
            text-decoration: underline;
        }
        .raw-content {
            display: none;
            white-space: pre-wrap;
            background-color: #f6f8fa;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .view-toggle {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:replace="fragments/header :: header"></div>

    <div class="page-header">
        <h1 th:text="${filename}">Markdown File</h1>
    </div>

    <div class="file-info">
        <strong>File:</strong> <span th:text="${filename}"></span> |
        <a th:href="@{/markdown}" class="btn btn-xs btn-default">Back to Markdown Files</a>
        <a th:href="@{/images}" class="btn btn-xs btn-default">View Images</a>
        <a th:href="@{/}" class="btn btn-xs btn-default">Back to Notes</a>
    </div>

    <div class="view-toggle">
        <div class="btn-group" role="group">
            <button type="button" class="btn btn-sm btn-primary" onclick="showRenderedView()">Rendered View</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="showRawView()">Raw View</button>
        </div>
    </div>

    <div class="markdown-content">
        <!-- Rendered Markdown View -->
        <div class="markdown-body" id="renderedView">
            <div th:if="${renderedContent != null}" th:utext="${renderedContent}">
                Rendered markdown content will be displayed here...
            </div>
            <div th:if="${renderedContent == null}" class="alert alert-warning">
                No content available or error rendering markdown.
            </div>
        </div>

        <!-- Raw Markdown View -->
        <div class="raw-content" id="rawView">
            <code th:text="${content} ?: 'No content available'">Raw markdown content will be displayed here...</code>
        </div>
    </div>

    <div class="text-center">
        <a th:href="@{/markdown}" class="btn btn-default">Back to Markdown Files</a>
        <a th:href="@{/images}" class="btn btn-info">View Images</a>
        <a th:href="@{/}" class="btn btn-primary">Back to Notes</a>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        showRenderedView();

        processImageUrls();
    });

    function showRenderedView() {
        document.getElementById('renderedView').style.display = 'block';
        document.getElementById('rawView').style.display = 'none';

        document.querySelectorAll('.view-toggle .btn').forEach(btn => {
            if (btn.textContent === 'Rendered View') {
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-primary');
            } else {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-secondary');
            }
        });
    }

    function showRawView() {
        document.getElementById('renderedView').style.display = 'none';
        document.getElementById('rawView').style.display = 'block';

        document.querySelectorAll('.view-toggle .btn').forEach(btn => {
            if (btn.textContent === 'Raw View') {
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add('btn-primary');
            } else {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-secondary');
            }
        });
    }

    function processImageUrls() {
        const images = document.querySelectorAll('#renderedView img');
        images.forEach(img => {
            const src = img.getAttribute('src');
            if (src && !src.startsWith('http') && !src.startsWith('data:') && !src.startsWith('/images/')) {
                img.setAttribute('src', '/images/' + src);
            }
        });

        const links = document.querySelectorAll('#renderedView a');
        links.forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.startsWith('http')) {
                link.setAttribute('target', '_blank');
                link.setAttribute('rel', 'noopener noreferrer');
            }
        });
    }
</script>
</body>
</html>
