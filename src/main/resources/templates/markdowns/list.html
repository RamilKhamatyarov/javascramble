<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head">
    <title>Markdown Files</title>
</head>
<body>
<div class="container">
    <div th:replace="fragments/header :: header"></div>

    <div class="page-header">
        <h1>Markdown Files</h1>
    </div>

    <div th:if="${not #lists.isEmpty(markdownFiles)}">
        <table class="table table-bordered table-hover horizontal-align">
            <thead>
            <tr>
                <th style="width: 50%">Filename</th>
                <th style="width: 20%">Size</th>
                <th style="width: 30%">Last Modified</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="file : ${markdownFiles}">
                <td>
                    <a th:href="@{'/markdown/{filename}'(filename=${file.filename})}"
                       th:text="${file.filename}">filename.md</a>
                </td>
                <td th:text="${#numbers.formatDecimal(file.fileSize / 1024, 1, 2) + ' KB'}" style="text-align: center">
                    size
                </td>
                <td th:text="${#temporals.format(file.lastModified, 'EEE, d MMM yyyy HH:mm')}" style="text-align: center">
                    date
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(markdownFiles)}" class="alert alert-info">
        No markdown files found in the configured directory.
    </div>

    <div class="text-center">
        <a th:href="@{/}" class="btn btn-default">Back to Notes</a>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
